name: AlphaEdge Daily Scan

# ── Architecture note ──────────────────────────────────────────────────────
# All scanning runs on VPS (67.207.82.11) via alphaedge.service.
# Data is pushed to GitHub by alphaedge-data-sync.timer at 14:05, 16:50,
# 20:35 UTC after each scan window.
#
# This workflow no longer runs cloud_scan.py. Reasons:
#   - GH Actions runner has no trained ML model → signals are always {}
#   - Competing git pushes from GH Actions + VPS cause constant conflicts
#   - Legacy main.py sent misleading "BUY signals: None" Telegram messages
#
# Trigger manually (workflow_dispatch) if you need to force a data sync
# or run a one-off diagnostic. For normal operations, the VPS handles
# everything automatically.
# ──────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run'
        required: false
        default: 'status'
        type: choice
        options:
          - status
          - force-data-sync

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Status
        run: |
          echo "================================================"
          echo "  AlphaEdge — GitHub Actions (passive mode)"
          echo "================================================"
          echo ""
          echo "  Live runtime: VPS 67.207.82.11"
          echo "  Service:      alphaedge.service (alpaca_live.py)"
          echo "  Data sync:    alphaedge-data-sync.timer"
          echo "                → fires 14:05, 16:50, 20:35 UTC Mon-Fri"
          echo ""
          echo "  docs/data/ last updated:"
          ls -lh docs/data/ || echo "  (no docs/data/)"
          echo ""
          echo "  To restart the VPS service:"
          echo "    ssh root@67.207.82.11 'systemctl restart alphaedge.service'"
          echo ""
          echo "  To force an immediate data sync:"
          echo "    ssh root@67.207.82.11 'bash /root/alpha_edge/scripts/sync_vps_data.sh'"

      - name: Force data sync (pull latest VPS commit)
        if: ${{ github.event.inputs.action == 'force-data-sync' }}
        run: |
          echo "Latest docs/data contents:"
          cat docs/data/latest_signals.json | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print(f'  Symbols: {len(d)}')
          if d:
              sample = next(iter(d.items()))
              print(f'  Sample ({sample[0]}): signal={sample[1].get(\"signal\")}, saved_at={sample[1].get(\"saved_at\")}')
          " 2>/dev/null || echo "  (empty or invalid)"

      - name: Upload docs/data as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-data-snapshot-${{ github.run_number }}
          path: docs/data/
          retention-days: 14
          if-no-files-found: ignore
